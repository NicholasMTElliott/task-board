name: CI

on:
  push:
  pull_request:
    branches: [mainline]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore task-board.sln
      - run: dotnet build task-board.sln --configuration Release --no-restore
      - run: dotnet test task-board.sln --configuration Release --no-restore --no-build --verbosity normal
