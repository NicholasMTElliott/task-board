services:
  postgres:
    image: postgres:17
    container_name: aiboard-postgres
    environment:
      POSTGRES_USER: aiboard
      POSTGRES_PASSWORD: aiboard
      POSTGRES_DB: aiboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiboard -d aiboard"]
      interval: 2s
      timeout: 5s
      retries: 10

  migrate:
    image: redgate/flyway:latest
    container_name: aiboard-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/flyway/sql:ro
    command:
      - -url=jdbc:postgresql://postgres:5432/aiboard
      - -user=aiboard
      - -password=aiboard
      - -locations=filesystem:/flyway/sql
      - -connectRetries=5
      - migrate
    restart: "no"

  grafana:
    image: grafana/grafana:latest
    container_name: aiboard-grafana
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

  # Build-only service for the agent sandbox image.
  # Run: docker compose --profile build build agent-sandbox
  # Or use: scripts/build-sandbox.ps1
  agent-sandbox:
    build:
      context: ./docker/agent-sandbox
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: node:22-slim
        AGENT_UID: 1000
        AGENT_GID: 1000
        CLAUDE_CLI_VERSION: latest
    image: aiboard-agent-sandbox:latest
    profiles:
      - build

volumes:
  pgdata:
  grafana_data:
