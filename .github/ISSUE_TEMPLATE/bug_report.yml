name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. See SECURITY.md.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact commands, inputs, and setup needed to reproduce the issue.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include logs or error output when useful.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, aiboard version/tag, .NET version, Docker version, board provider, and agent executor.
      placeholder: |
        OS:
        aiboard version/tag:
        dotnet --info:
        Docker version:
        Board provider:
        Agent executor:
    validations:
      required: true
