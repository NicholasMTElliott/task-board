name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore task-board.sln
      - run: dotnet test task-board.sln --configuration Release --no-restore --verbosity normal

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      # Required so action-gh-release can create / append to the release.
      contents: write
    strategy:
      # Each matrix job uploads its own asset directly to the release; failure
      # of one platform shouldn't cancel the others.
      fail-fast: false
      matrix:
        include:
          # Self-contained — bundles the .NET runtime; runs on any host without
          # a separate .NET install. Single-file. Larger (~33 MB compressed).
          # Asset names: aiboard-{rid}.{ext} (no suffix, backward-compat with
          # release pages prior to v0.0.23).
          - rid: win-x64
            ext: zip
            deployment: sc
          - rid: linux-x64
            ext: tar.gz
            deployment: sc
          - rid: osx-x64
            ext: tar.gz
            deployment: sc
          - rid: osx-arm64
            ext: tar.gz
            deployment: sc
          # Framework-dependent — requires .NET 10 runtime to be installed on
          # the host. Smaller (~5–10 MB compressed). For users who already
          # have .NET 10 and want a faster cold start / smaller download.
          # Asset names: aiboard-{rid}-fdd.{ext}.
          - rid: win-x64
            ext: zip
            deployment: fdd
          - rid: linux-x64
            ext: tar.gz
            deployment: fdd
          - rid: osx-x64
            ext: tar.gz
            deployment: fdd
          - rid: osx-arm64
            ext: tar.gz
            deployment: fdd
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        shell: bash
        run: |
          # Self-contained → single-file with bundled runtime.
          # Framework-dependent → multi-file, expects .NET 10 on host.
          if [ "${{ matrix.deployment }}" = "sc" ]; then
            EXTRA_FLAGS="--self-contained -p:PublishSingleFile=true"
          else
            EXTRA_FLAGS="--no-self-contained"
          fi
          dotnet publish lambda/src/TaskBoard.Worker/TaskBoard.Worker.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            $EXTRA_FLAGS \
            -p:Version=${GITHUB_REF_NAME#v} \
            --output dist/${{ matrix.rid }}-${{ matrix.deployment }}
      - name: Compute artifact name
        id: name
        shell: bash
        run: |
          # SC keeps the unsuffixed name (backward-compat). FDD adds -fdd suffix.
          if [ "${{ matrix.deployment }}" = "sc" ]; then
            SUFFIX=""
          else
            SUFFIX="-fdd"
          fi
          echo "file=aiboard-${{ matrix.rid }}${SUFFIX}.${{ matrix.ext }}" >> "$GITHUB_OUTPUT"
      - name: Package
        shell: bash
        run: |
          if [ "${{ matrix.ext }}" = "zip" ]; then
            cd dist/${{ matrix.rid }}-${{ matrix.deployment }} && zip -r "../../${{ steps.name.outputs.file }}" .
          else
            cd dist/${{ matrix.rid }}-${{ matrix.deployment }} && tar czf "../../${{ steps.name.outputs.file }}" .
          fi
      # Upload directly to the release — no intermediate artifact handoff.
      # action-gh-release is idempotent: the first matrix job to finish creates
      # the release; subsequent jobs append their files to the same tag. This
      # eliminates the artifact-storage path entirely (which was eating the
      # account's quota and silently breaking v0.0.11/12/13 — see commit history).
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: ${{ steps.name.outputs.file }}
          generate_release_notes: true
