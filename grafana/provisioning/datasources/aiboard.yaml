apiVersion: 1

datasources:
  - name: aiboard-postgres
    type: postgres
    url: postgres:5432
    database: aiboard
    user: aiboard
    secureJsonData:
      password: aiboard
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1700
      timescaledb: false
    isDefault: true
    editable: false
